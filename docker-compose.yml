services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: thera-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-thera}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-thera123}
      - DATABASE_NAME=${DATABASE_NAME:-thera_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - SHIPPING_API_URL=${SHIPPING_API_URL:-https://api.melhorenvio.com.br}
      - SHIPPING_API_KEY=${SHIPPING_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - thera-network

  postgres:
    image: postgres:16-alpine
    container_name: thera-postgres
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-thera}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-thera123}
      - POSTGRES_DB=${DATABASE_NAME:-thera_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-thera} -d ${DATABASE_NAME:-thera_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thera-network

  redis:
    image: redis:7-alpine
    container_name: thera-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thera-network

volumes:
  postgres_data:
  redis_data:

networks:
  thera-network:
    driver: bridge

